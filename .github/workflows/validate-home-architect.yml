name: Validate Home Architect
on:
  pull_request:
    paths: ["home_architect/**", "tests/test_home_architect.py", ".github/workflows/validate-home-architect.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install aiohttp
      - run: python -m unittest tests/test_home_architect.py
      - run: python -m py_compile home_architect/app.py
