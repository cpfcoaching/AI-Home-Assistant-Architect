name: Solar Assistant
version: "0.2.2"
slug: solar_sentinel
description: Local-first solar equipment inventory and health monitoring
url: https://github.com/cpfcoaching/AI-Home-Assistant-Architect
arch:
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: Solar Assistant
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
stage: experimental
apparmor: true
backup: hot
options:
  stale_after_minutes: 30
  low_production_threshold_w: 100
  minimum_solar_elevation: 10
  minimum_peer_power_w: 75
  peer_watch_ratio: 0.85
  peer_critical_ratio: 0.50
  anomaly_persistence_minutes: 30
  scan_interval_minutes: 5
  ollama_url: ""
  ollama_model: qwen3:8b
schema:
  stale_after_minutes: int(5,1440)
  low_production_threshold_w: int(0,100000)
  minimum_solar_elevation: int(-10,90)
  minimum_peer_power_w: int(0,10000)
  peer_watch_ratio: float(0.1,1.0)
  peer_critical_ratio: float(0.1,1.0)
  anomaly_persistence_minutes: int(5,1440)
  scan_interval_minutes: int(1,60)
  ollama_url: str?
  ollama_model: str
