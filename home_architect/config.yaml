name: Home Architect
version: "0.2.0"
slug: home_architect
description: Local text assistant for solar, climate, and energy diagnostics
url: https://github.com/cpfcoaching/AI-Home-Assistant-Architect
arch: [amd64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:assistant
panel_title: Home Architect
panel_admin: true
watchdog: http://[HOST]:[PORT:8099]/health
stage: experimental
apparmor: true
backup: hot
options:
  ollama_url: "http://ollama:11434"
  ollama_model: qwen2.5:1.5b
  max_history_messages: 4
  max_context_entities: 15
  num_ctx: 2048
  num_predict: 256
schema:
  ollama_url: url
  ollama_model: str
  max_history_messages: int(2,40)
  max_context_entities: int(5,20)
  num_ctx: int(1024,4096)
  num_predict: int(64,512)
